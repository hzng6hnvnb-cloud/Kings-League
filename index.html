<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kings League</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #252a30, #07090b 65%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .glass {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 28px;
      box-shadow: 0 20px 70px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    .section {
      margin-bottom: 20px;
    }

    .section h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #888;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 17px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
      margin-top: 8px;
    }

    button:active {
      transform: scale(.98);
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7070;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- شاشة البداية -->
  <div class="glass" id="home">

    <div class="logo">
      👑 Kings League
    </div>

    <div class="subtitle">
      دوري الملوك
    </div>

    <button onclick="showSetup()">
      ابدأ مباراة
    </button>

  </div>


  <!-- إعداد المباراة -->
  <div class="glass hidden" id="setup">

    <div class="logo">
      ⚽ إعداد المباراة
    </div>

    <div class="section">
      <h2>الفريق الأول</h2>

      <input
        id="team1"
        type="text"
        placeholder="اسم الفريق"
      >

      <input
        id="captain1"
        type="text"
        placeholder="اسم الكابتن"
      >
    </div>


    <div class="section">
      <h2>الفريق الثاني</h2>

      <input
        id="team2"
        type="text"
        placeholder="اسم الفريق"
      >

      <input
        id="captain2"
        type="text"
        placeholder="اسم الكابتن"
      >
    </div>


    <button onclick="startMatch()">
      ابدأ المباراة ⚽
    </button>

    <div class="error" id="error">
      عبّ جميع الخانات أولًا
    </div>

  </div>


  <!-- شاشة المباراة -->
  <div class="glass hidden" id="match">

    <div class="logo">
      👑 Kings League
    </div>

    <div style="text-align:center; margin-top:25px;">

      <div id="matchTeams"
           style="font-size:20px;font-weight:bold;">
      </div>

      <div style="font-size:55px;font-weight:900;margin:20px 0;">
        <span id="score1">0</span>
        -
        <span id="score2">0</span>
      </div>

      <div style="font-size:25px;">
        الدقيقة <span id="minute">0</span>
      </div>

    </div>

  </div>

</div>


<script>

function showSetup() {

  document.getElementById("home").classList.add("hidden");

  document.getElementById("setup").classList.remove("hidden");

}


function startMatch() {

  const team1 =
    document.getElementById("team1").value.trim();

  const captain1 =
    document.getElementById("captain1").value.trim();

  const team2 =
    document.getElementById("team2").value.trim();

  const captain2 =
    document.getElementById("captain2").value.trim();


  if (!team1 || !captain1 || !team2 || !captain2) {

    document.getElementById("error").style.display = "block";

    return;
  }


  document.getElementById("error").style.display = "none";

  document.getElementById("setup").classList.add("hidden");

  document.getElementById("match").classList.remove("hidden");


  document.getElementById("matchTeams").innerHTML =
    team1 + " 👑 " + captain1 +
    "<br><br>" +
    team2 + " 👑 " + captain2;

}

</script>

</body>
</html>
